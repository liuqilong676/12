<rect x='40' y='129' width='330' height='96' fill='rgb(255,255,255)' stroke='black' stroke-width='1.5'/>
<text x='52' y='157' font-family='SimHei,Microsoft YaHei,sans-serif' font-size='19px' fill='black'>- deviceId : String</text>
<text x='52' y='185' font-family='SimHei,Microsoft YaHei,sans-serif' font-size='19px' fill='black'>- name : String</text>
<text x='52' y='213' font-family='SimHei,Microsoft YaHei,sans-serif' font-size='19px' fill='black'>- location : String</text>
<rect x='40' y='225' width='330' height='40' fill='rgb(255,255,255)' stroke='black' stroke-width='1.5'/>
<text x='52' y='253' font-family='SimHei,Microsoft YaHei,sans-serif' font-size='19px' fill='black'>+ describe() : String</text>
<rect x='540' y='80' width='340' height='49' fill='rgb(222,235,247)' stroke='black' stroke-width='1.5'/>
<text x='710.0' y='109.5' font-family='SimHei,Microsoft YaHei,sans-serif' font-size='19px' fill='black' text-anchor='middle' font-weight='bold'>WorkOrder 工单</text>
<rect x='540' y='129' width='340' height='152' fill='rgb(255,255,255)' stroke='black' stroke-width='1.5'/>
<text x='552' y='157' font-family='SimHei,Microsoft YaHei,sans-serif' font-size='19px' fill='black'>- orderId : String</text>
