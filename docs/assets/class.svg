<text x='552' y='337' font-family='SimHei,Microsoft YaHei,sans-serif' font-size='19px' fill='black'>+ describe() : String</text>
<line x1='370' y1='190' x2='540' y2='190' stroke='black' stroke-width='1.5'/>
<text x='455' y='177' font-family='SimHei,Microsoft YaHei,sans-serif' font-size='17px' fill='black' text-anchor='middle'>报修</text>
<text x='384' y='169' font-family='SimHei,Microsoft YaHei,sans-serif' font-size='17px' fill='black' text-anchor='start'>1</text>
<text x='506' y='169' font-family='SimHei,Microsoft YaHei,sans-serif' font-size='17px' fill='black' text-anchor='start'>0..*</text>
<text x='40' y='45' font-family='SimHei,Microsoft YaHei,sans-serif' font-size='21px' fill='black' text-anchor='start' font-weight='bold'>校园物联网设备报修：类图</text>
<text x='40' y='408' font-family='SimHei,Microsoft YaHei,sans-serif' font-size='16px' fill='black' text-anchor='start'>约束：status ∈ {PENDING, PROCESSING, COMPLETED}；</text>
<text x='40' y='434' font-family='SimHei,Microsoft YaHei,sans-serif' font-size='16px' fill='black' text-anchor='start'>一台设备对应 0..* 张工单，每张工单对应 1 台设备。</text>
