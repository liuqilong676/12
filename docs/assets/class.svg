            orient='auto' markerUnits='userSpaceOnUse'>
      <path d='M0,1 L11,5 L0,9 z' fill='black'/>
    </marker>
  </defs>
<rect x='0' y='0' width='900' height='470' fill='white'/>
<rect x='40' y='80' width='330' height='49' fill='rgb(222,235,247)' stroke='black' stroke-width='1.5'/>
